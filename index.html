<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preetham Bhat</title>
    <meta name="description" content="Full-Stack Web Developer crafting beautiful, functional, and user-centered digital experiences" />

    <style>
      #preloader {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, #18042F, #0D011F);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(209, 123, 255, 0.2);
        border-top-color: #D17BFF;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      body.loaded #preloader {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div class="spinner"></div>
    </div>
    <div id="root" style="opacity: 0; transition: opacity 1s ease-in-out;"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      import gsap from 'https://cdn.skypack.dev/gsap';

      window.addEventListener('load', () => {
        gsap.to('#preloader', {
          delay: 1,
          duration: 1,
          opacity: 0,
          onComplete: () => {
            document.getElementById("preloader").style.display = "none";
            document.body.classList.add('loaded');
            document.getElementById("root").style.opacity = "1";
          }
        });
      });
    </script>
  </body>
</html>
